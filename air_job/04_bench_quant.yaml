experiment_name: irodori_tts_infer
mlflow_run_name: bench_quant_a10

environment:
  version: '4'
  dependencies:
    - uv

env_variables:
  HF_HUB_ENABLE_HF_TRANSFER: "0"

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..

max_retries: 0
timeout_minutes: 90

command: |
  set -euo pipefail
  echo "[air] ===== GPU ====="; nvidia-smi || true
  cd "$CODE_SOURCE_PATH"
  command -v uv >/dev/null 2>&1 || pip install -q uv
  export UV_PROJECT_ENVIRONMENT=/tmp/tts_venv
  export UV_CACHE_DIR=/tmp/uv_cache
  export HF_HUB_ENABLE_HF_TRANSFER=0
  echo "[air] ===== uv sync (cu128) ====="
  uv sync --extra cu128 --no-install-project 2>&1 | tail -20
  echo "[air] ===== benchmark ====="
  uv run --no-sync python air_job/bench_quant.py
  echo "[air] ===== copy results to volume ====="
  DEST=/Volumes/hiroshi/air_samples/tts/bench
  mkdir -p "$DEST"
  for f in /tmp/tts_bench/*; do cp "$f" "$DEST/"; done
  echo "[air] ===== done ====="; ls -la "$DEST"
